spring.application.name=sistema-agua

# ---- Base de dados PostgreSQL ----
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/sistema_agua}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

# ---- Upload de ficheiros (logo da empresa, fotos de leituras) ----
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# ---- Porta do servidor ----
server.port=${PORT:8080}

# ---- Locale ----
spring.web.locale=pt_MZ
spring.mvc.format.date=dd/MM/yyyy

# ---- Notificacoes por SMS (MozeSMS) ----
# Muda para 'true' quando tiveres credenciais reais e quiseres ativar o envio.
# Enquanto for 'false', o sistema so REGISTA no log o que enviaria, sem
# fazer pedidos reais — seguro para testar sem credenciais.
notificacoes.sms.ativado=${SMS_ATIVADO:false}
# Metodo servidor-servidor (API Key + Secret), conforme a documentacao do MozeSMS
mozesms.api-key=${MOZESMS_API_KEY:}
mozesms.api-secret=${MOZESMS_API_SECRET:}
mozesms.from=${MOZESMS_FROM:ESHOP}
mozesms.api.url=https://api.mozesms.com/sms/send

# ---- Pagamentos M-Pesa / e-Mola (ZumboPay) ----
# Muda para 'true' quando tiveres credenciais reais e wallets configuradas.
zumbopay.ativado=${ZUMBOPAY_ATIVADO:false}
zumbopay.api-key=${ZUMBOPAY_API_KEY:}
zumbopay.merchant-id=${ZUMBOPAY_MERCHANT_ID:}
zumbopay.wallet-id-mpesa=${ZUMBOPAY_WALLET_MPESA:}
zumbopay.wallet-id-emola=${ZUMBOPAY_WALLET_EMOLA:}
zumbopay.webhook-secret=${ZUMBOPAY_WEBHOOK_SECRET:}
zumbopay.api.base-url=https://zumbopay.com/api/public/v1

# ---- Fotos das leituras remotas ----
fotos.pasta=./fotos-leituras

# ---- Backup ----
# Caminho do executavel pg_dump. Se nao estiver no PATH do sistema, colocar
# o caminho completo aqui, ex: C:/Program Files/PostgreSQL/16/bin/pg_dump.exe
backup.pgdump.path=pg_dump
# Pasta onde os backups automaticos diarios sao guardados
backup.pasta=./backups
