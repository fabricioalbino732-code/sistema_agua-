<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Cliente')}"></head>
<body>
<nav th:replace="~{layout :: menu}"></nav>
<div class="container">
    <div th:replace="~{layout :: mensagens}"></div>

    <h1 th:text="${clienteId} != null ? 'Editar Cliente' : 'Novo Cliente'"></h1>

    <div class="card">
        <form th:action="${clienteId} != null ? @{/clientes/{id}/editar(id=${clienteId})} : @{/clientes/novo}"
              th:object="${clienteDTO}" method="post">

            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" th:field="*{nomeCompleto}">
                <div class="erro-campo" th:if="${#fields.hasErrors('nomeCompleto')}" th:errors="*{nomeCompleto}"></div>
            </div>

            <div class="form-group">
                <label>N.º do Contador</label>
                <input type="text" th:field="*{numeroContador}">
                <div class="erro-campo" th:if="${#fields.hasErrors('numeroContador')}" th:errors="*{numeroContador}"></div>
            </div>

            <div class="form-group">
                <label>Bairro</label>
                <input type="text" th:field="*{bairro}">
            </div>

            <div class="form-group">
                <label>Endereco</label>
                <input type="text" th:field="*{endereco}">
            </div>

            <div class="form-group">
                <label>Telefone</label>
                <input type="text" th:field="*{telefone}">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" th:field="*{email}">
                <div class="erro-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="form-group">
                <label>Tipo de Cliente</label>
                <select th:field="*{tipoCliente}">
                    <option th:each="tipo : ${tiposCliente}" th:value="${tipo}" th:text="${tipo}"></option>
                </select>
            </div>

            <div class="form-group">
                <label>Data de Ligacao</label>
                <input type="date" th:field="*{dataLigacao}">
            </div>

            <div class="form-group">
                <label>Observacoes</label>
                <textarea th:field="*{observacoes}" rows="3"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/clientes}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
</body>
</html>
