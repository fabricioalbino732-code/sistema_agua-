<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Editar Leitura')}"></head>
<body>
<nav th:replace="~{layout :: menu}"></nav>
<div class="container">
    <div th:replace="~{layout :: mensagens}"></div>

    <h1>Corrigir Leitura</h1>

    <div class="card">
        <p><strong>Cliente:</strong> <span th:text="${clienteNome}"></span></p>

        <form th:action="@{/leituras/{id}/editar(id=${leituraId})}" th:object="${leituraDTO}" method="post">

            <div class="form-group">
                <label>Data da Leitura</label>
                <input type="date" th:field="*{dataLeitura}">
            </div>

            <div class="form-group">
                <label>Leitura Anterior (m3)</label>
                <input type="number" step="0.01" th:field="*{leituraAnterior}">
                <div class="erro-campo" th:if="${#fields.hasErrors('leituraAnterior')}" th:errors="*{leituraAnterior}"></div>
            </div>

            <div class="form-group">
                <label>Leitura Atual (m3)</label>
                <input type="number" step="0.01" th:field="*{leituraAtual}">
                <div class="erro-campo" th:if="${#fields.hasErrors('leituraAtual')}" th:errors="*{leituraAtual}"></div>
            </div>

            <div class="form-group">
                <label>Responsavel pela Leitura</label>
                <input type="text" th:field="*{responsavelLeitura}">
            </div>

            <div class="form-group">
                <label>Observacoes</label>
                <textarea th:field="*{observacoes}" rows="2"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Guardar Correcao</button>
            <a th:href="@{/leituras}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
</body>
</html>
