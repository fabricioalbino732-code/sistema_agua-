<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Novo Utilizador')}"></head>
<body>
<nav th:replace="~{layout :: menu}"></nav>
<div class="container">
    <div th:replace="~{layout :: mensagens}"></div>

    <h1>Novo Utilizador</h1>

    <div class="card">
        <form th:action="@{/usuarios/novo}" th:object="${usuarioDTO}" method="post">

            <div class="form-group">
                <label>Username</label>
                <input type="text" th:field="*{username}">
                <div class="erro-campo" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>

            <div class="form-group">
                <label>Senha</label>
                <input type="password" th:field="*{senha}">
                <div class="erro-campo" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>
            </div>

            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" th:field="*{nomeCompleto}">
                <div class="erro-campo" th:if="${#fields.hasErrors('nomeCompleto')}" th:errors="*{nomeCompleto}"></div>
            </div>

            <div class="form-group">
                <label>Perfil</label>
                <select th:field="*{perfil}">
                    <option th:each="p : ${perfis}" th:value="${p}" th:text="${p}"></option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">Criar Utilizador</button>
            <a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
</body>
</html>
